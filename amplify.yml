version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e AMAZON_ACCESS_KEY_ID -e AMAZON_SECRET_ACCESS_KEY -e RECAPTCHA_SECRET_KEY >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
